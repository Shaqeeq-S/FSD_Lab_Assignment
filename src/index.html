<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System</title>
</head>

<body>

    <h1>Contact Management System</h1>

    <p>Add, view, update and delete contacts</p>

    <hr>

    <!-- Add / Update Contact -->

    <h2 id="formTitle">Add New Contact</h2>

    <div id="message"></div>

    <form id="contactForm">

        <p>
            <label>Contact ID:</label>
            <input
                type="text"
                id="contactId"
                placeholder="C001"
                required
            >
        </p>

        <p>
            <label>Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter name"
                required
            >
        </p>

        <p>
            <label>Phone:</label>
            <input
                type="text"
                id="phone"
                placeholder="10 digit phone number"
                maxlength="10"
                required
            >
        </p>

        <p>
            <label>Email:</label>
            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
            >
        </p>

        <button
            type="submit"
            id="submitButton"
        >
            Add Contact
        </button>

        <button
            type="button"
            onclick="clearForm()"
        >
            Clear
        </button>

    </form>

    <hr>

    <!-- Contact List -->

    <h2>Contact List</h2>

    <input
        type="text"
        id="search"
        placeholder="Search contacts..."
        oninput="searchContacts()"
    >

    <br><br>

    <table border="1" cellpadding="8">

        <thead>

            <tr>
                <th>Contact ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="contactTable"></tbody>

    </table>

    <p id="emptyMessage">
        No contacts found.
    </p>

    <hr>

    <!-- API Response -->

    <h2>API Response</h2>

    <pre id="apiResponse">No API response yet.</pre>

    <script>

        let contacts = [];

        let editingId = null;


        // =====================================
        // SHOW API RESPONSE
        // =====================================

        function showApiResponse(data) {

            document.getElementById("apiResponse").textContent =
                JSON.stringify(data, null, 4);

        }


        // =====================================
        // LOAD CONTACTS - GET /contacts
        // =====================================

        async function loadContacts() {

            try {

                const response =
                    await fetch("/contacts");

                const data =
                    await response.json();

                // Show API response
                showApiResponse(data);

                contacts =
                    data.contacts || [];

                displayContacts(contacts);

            }

            catch (error) {

                showApiResponse({
                    error: error.message
                });

                showMessage(
                    "Unable to load contacts."
                );

            }

        }


        // =====================================
        // DISPLAY CONTACTS
        // =====================================

        function displayContacts(list) {

            const table =
                document.getElementById("contactTable");

            const empty =
                document.getElementById("emptyMessage");

            table.innerHTML = "";

            if (list.length === 0) {

                empty.style.display = "block";

                return;

            }

            empty.style.display = "none";

            list.forEach(contact => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `

                    <td>${contact.contactId}</td>

                    <td>${contact.name}</td>

                    <td>${contact.phone}</td>

                    <td>${contact.email}</td>

                    <td>

                        <button
                            onclick="editContact('${contact.contactId}')"
                        >
                            Edit
                        </button>

                        <button
                            onclick="deleteContact('${contact.contactId}')"
                        >
                            Delete
                        </button>

                    </td>

                `;

                table.appendChild(row);

            });

        }


        // =====================================
        // ADD / UPDATE CONTACT
        // =====================================

        document
            .getElementById("contactForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const contactId =
                        document
                            .getElementById("contactId")
                            .value
                            .trim();

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const phone =
                        document
                            .getElementById("phone")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    // Phone validation

                    if (!/^[0-9]{10}$/.test(phone)) {

                        showMessage(
                            "Phone number must contain exactly 10 digits."
                        );

                        showApiResponse({
                            message:
                                "Phone number must contain exactly 10 digits."
                        });

                        return;

                    }


                    try {

                        let response;


                        // UPDATE

                        if (editingId) {

                            response =
                                await fetch(
                                    `/contacts/${editingId}`,
                                    {
                                        method: "PUT",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                name,
                                                phone,
                                                email
                                            })
                                    }
                                );

                        }


                        // CREATE

                        else {

                            response =
                                await fetch(
                                    "/contacts",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                contactId,
                                                name,
                                                phone,
                                                email
                                            })
                                    }
                                );

                        }


                        const data =
                            await response.json();


                        // Show actual API response

                        showApiResponse(data);


                        if (!response.ok) {

                            throw new Error(
                                data.error ||
                                data.message
                            );

                        }


                        showMessage(
                            editingId
                                ? "Contact updated successfully."
                                : "Contact added successfully."
                        );


                        clearForm();

                        await loadContacts();

                    }

                    catch (error) {

                        showMessage(
                            error.message
                        );

                        showApiResponse({
                            error: error.message
                        });

                    }

                }
            );


        // =====================================
        // EDIT CONTACT
        // =====================================

        function editContact(contactId) {

            const contact =
                contacts.find(
                    c =>
                        c.contactId === contactId
                );


            if (!contact) {
                return;
            }


            document
                .getElementById("contactId")
                .value =
                    contact.contactId;

            document
                .getElementById("name")
                .value =
                    contact.name;

            document
                .getElementById("phone")
                .value =
                    contact.phone;

            document
                .getElementById("email")
                .value =
                    contact.email;


            editingId =
                contactId;


            document
                .getElementById("formTitle")
                .textContent =
                    "Update Contact";


            document
                .getElementById("submitButton")
                .textContent =
                    "Update Contact";


            document
                .getElementById("contactId")
                .disabled =
                    true;

        }


        // =====================================
        // DELETE CONTACT
        // =====================================

        async function deleteContact(contactId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this contact?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/contacts/${contactId}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                // Show actual API response

                showApiResponse(data);


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error
                    );

                }


                showMessage(
                    "Contact deleted successfully."
                );


                await loadContacts();

            }

            catch (error) {

                showMessage(
                    error.message
                );

                showApiResponse({
                    error: error.message
                });

            }

        }


        // =====================================
        // SEARCH
        // =====================================

        function searchContacts() {

            const search =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();


            const filtered =
                contacts.filter(contact =>

                    contact.contactId
                        .toLowerCase()
                        .includes(search)

                    ||

                    contact.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    contact.phone
                        .includes(search)

                    ||

                    contact.email
                        .toLowerCase()
                        .includes(search)

                );


            displayContacts(filtered);

        }


        // =====================================
        // CLEAR FORM
        // =====================================

        function clearForm() {

            document
                .getElementById("contactForm")
                .reset();


            document
                .getElementById("contactId")
                .disabled =
                    false;


            editingId = null;


            document
                .getElementById("formTitle")
                .textContent =
                    "Add New Contact";


            document
                .getElementById("submitButton")
                .textContent =
                    "Add Contact";

        }


        // =====================================
        // MESSAGE
        // =====================================

        function showMessage(message) {

            document
                .getElementById("message")
                .textContent =
                    message;

        }


        // =====================================
        // START APPLICATION
        // =====================================

        loadContacts();

    </script>

</body>

</html>
